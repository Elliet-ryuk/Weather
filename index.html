<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline – Weather Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="script1.js" defer></script>
<link rel="stylesheet" href="style1.css">
</head>
<body data-theme="clear">
<div class="app">
  <header class="top">
    <div class="brand">Skyline</div>
    <form class="search" id="searchForm" autocomplete="off" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search a city, e.g. Delhi" aria-label="Search city" aria-controls="suggest" aria-expanded="false">
      <div class="suggest" id="suggest" role="listbox"></div>
    </form>
    <div class="seg" role="group" aria-label="Temperature unit">
      <button type="button" id="uC" aria-pressed="true">°C</button>
      <button type="button" id="uF" aria-pressed="false">°F</button>
    </div>
  </header>

  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <main class="grid">
    <section class="card hero">
      <div>
        <div class="city" id="city">—</div>
        <div class="date" id="date">—</div>
        <div class="temp"><span id="temp">--</span><sup id="unit">°C</sup></div>
        <div class="cond" id="cond">Loading…</div>
      </div>
      <div class="big-icon" id="bigIcon" aria-hidden="true">⛅</div>
    </section>

    <section class="card">
      <h2>Right now</h2>
      <div class="stats">
        <div class="stat"><span>Feels like</span><b id="feels">--</b></div>
        <div class="stat"><span>Humidity</span><b id="hum">--</b></div>
        <div class="stat"><span>Wind speed</span><b id="wind">--</b></div>
        <div class="stat"><span>Pressure</span><b id="pres">--</b></div>
        <div class="stat"><span>Sunrise</span><b id="rise">--</b></div>
        <div class="stat"><span>Sunset</span><b id="set">--</b></div>
      </div>
    </section>

    <section class="card">
      <h2>Chance of rain, next 12 hours</h2>
      <div class="bars" id="bars"></div>
    </section>

    <section class="card">
      <h2>7-day forecast</h2>
      <div class="days" id="days"></div>
    </section>

    <section class="card">
      <h2>Other cities</h2>
      <div class="cities" id="cities"></div>
    </section>
  </main>
  <p class="src" id="src"></p>
</div>

</body>
</html>
